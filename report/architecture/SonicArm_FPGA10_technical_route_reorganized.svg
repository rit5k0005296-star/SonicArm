<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .bg{fill:#f4f8fa}.panel{fill:#fff;stroke:#bfd0da;stroke-width:2}.group{fill:#fbfdfe;stroke-width:2.5;stroke-dasharray:10 8}
      .t{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15334a}.title{font-size:40px;font-weight:700}.sub{font-size:19px;fill:#537084}
      .h1{font-size:25px;font-weight:700}.h2{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#5c7485}.code{font-size:14px;fill:#197f91;font-weight:700}
      .blue{fill:#eef7fc;stroke:#65aaca}.teal{fill:#edf9f7;stroke:#42a99f}.amber{fill:#fff7e9;stroke:#e4a64d}.green{fill:#eff9f2;stroke:#65ad7f}.purple{fill:#f5f1fb;stroke:#9981c6}.red{fill:#fff1f1;stroke:#d77b7b}
      .line{fill:none;stroke:#3e758d;stroke-width:4}.feedback{fill:none;stroke:#7a91a0;stroke-width:3;stroke-dasharray:8 7}.thin{fill:none;stroke:#4b8095;stroke-width:2.5}
      .badge{fill:#168da1}.badgeText{font-size:15px;font-weight:700;fill:#fff}.num{font-size:15px;font-weight:700;fill:#fff}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3e758d"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7a91a0"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".10"/></filter>
  </defs>

  <rect class="bg" width="1920" height="1080"/>
  <rect x="0" y="0" width="1920" height="142" fill="#fff"/>
  <rect x="0" y="138" width="1920" height="5" fill="#1596a8"/>
  <text x="62" y="70" class="t title">SonicArm 声纹鉴权与语音控制机械臂技术路线</text>
  <text x="64" y="108" class="t sub">PYNQ‑Z2 · FPGA‑10 单 Overlay · 身份鉴权 → 命令识别 → 安全决策 → Arduino 动作执行</text>
  <rect x="1615" y="48" width="245" height="48" rx="24" fill="#eaf7f8" stroke="#a8d7dc"/>
  <circle cx="1650" cy="72" r="9" fill="#1596a8"/><text x="1670" y="79" class="t body">竞赛演示主流程</text>

  <!-- Physical I/O -->
  <rect x="45" y="178" width="1830" height="155" rx="22" class="group" stroke="#d6a04f"/>
  <text x="74" y="211" class="t h2">01 交互与物理接口</text>
  <rect x="78" y="231" width="250" height="72" rx="16" class="panel amber"/>
  <text x="203" y="258" text-anchor="middle" class="t h2">有线耳麦</text><text x="203" y="283" text-anchor="middle" class="t small">模拟麦克风 → HP/Mic</text>
  <rect x="396" y="231" width="290" height="72" rx="16" class="panel blue"/>
  <text x="541" y="258" text-anchor="middle" class="t h2">5 英寸触控显示屏</text><text x="541" y="283" text-anchor="middle" class="t small">HDMI 图像 + USB HID 触摸</text>
  <path d="M328 267H780" class="line" marker-end="url(#arrow)"/><text x="345" y="254" class="t small">语音</text>
  <path d="M686 277H780" class="line" marker-end="url(#arrow)"/><text x="699" y="263" class="t small">触摸事件</text>
  <path d="M1490 277H690" class="feedback" marker-end="url(#arrow2)"/><text x="1125" y="265" class="t small">HDMI 画面 / 状态反馈</text>
  <rect x="1510" y="231" width="320" height="72" rx="16" class="panel green"/>
  <text x="1670" y="258" text-anchor="middle" class="t h2">六自由度机械臂</text><text x="1670" y="283" text-anchor="middle" class="t small">抓取 / 右侧松开 / 伸直复位</text>

  <!-- PYNQ group -->
  <rect x="45" y="364" width="1400" height="554" rx="24" class="group" stroke="#4f9fc2"/>
  <text x="75" y="400" class="t h2">02 PYNQ‑Z2 主控节点：单进程拥有 Overlay、音频、模型与状态</text>

  <!-- UI and orchestration -->
  <rect x="78" y="430" width="300" height="176" rx="20" class="panel blue" filter="url(#shadow)"/>
  <rect x="96" y="447" width="60" height="28" rx="8" class="badge"/><text x="126" y="466" text-anchor="middle" class="badgeText">PS</text>
  <text x="228" y="500" text-anchor="middle" class="t h1">交互与任务编排</text>
  <text x="228" y="533" text-anchor="middle" class="t code">app.py</text>
  <text x="228" y="558" text-anchor="middle" class="t body">native_display.py / ui/server.py</text>
  <text x="228" y="582" text-anchor="middle" class="t small">触摸启动 · 注册/识别 · 状态显示</text>

  <rect x="420" y="430" width="300" height="176" rx="20" class="panel amber" filter="url(#shadow)"/>
  <rect x="438" y="447" width="60" height="28" rx="8" class="badge"/><text x="468" y="466" text-anchor="middle" class="badgeText">PS</text>
  <text x="570" y="500" text-anchor="middle" class="t h1">音频前端</text>
  <text x="570" y="533" text-anchor="middle" class="t code">board_runtime.py + v9_audio.py</text>
  <text x="570" y="558" text-anchor="middle" class="t body">48 kHz 采集 · 质量门控 · 选通道</text>
  <text x="570" y="582" text-anchor="middle" class="t small">重采样 16 kHz · Log‑Mel / Fbank</text>

  <rect x="762" y="430" width="334" height="176" rx="20" class="panel teal" filter="url(#shadow)"/>
  <rect x="780" y="447" width="95" height="28" rx="8" class="badge"/><text x="827" y="466" text-anchor="middle" class="badgeText">PS + PL</text>
  <text x="929" y="500" text-anchor="middle" class="t h1">CAM++ 声纹鉴权</text>
  <text x="929" y="533" text-anchor="middle" class="t body">PS 前后处理 + PL 卷积/FCM 加速</text>
  <text x="929" y="558" text-anchor="middle" class="t small">192维嵌入 · 余弦相似度 · 用户模板</text>
  <text x="929" y="582" text-anchor="middle" class="t small">AXI 控制 / DDR 共享缓冲区</text>

  <rect x="1138" y="430" width="270" height="176" rx="20" class="panel purple" filter="url(#shadow)"/>
  <rect x="1156" y="447" width="60" height="28" rx="8" class="badge"/><text x="1186" y="466" text-anchor="middle" class="badgeText">PS</text>
  <text x="1273" y="500" text-anchor="middle" class="t h1">TC‑ResNet3</text>
  <text x="1273" y="533" text-anchor="middle" class="t body">15 类短语识别</text>
  <text x="1273" y="558" text-anchor="middle" class="t small">同一段 16 kHz 语音复用</text>
  <text x="1273" y="582" text-anchor="middle" class="t small">输出类别 + 置信度</text>

  <path d="M378 520H420" class="line" marker-end="url(#arrow)"/><circle cx="398" cy="520" r="15" class="badge"/><text x="398" y="526" text-anchor="middle" class="num">1</text>
  <path d="M720 520H762" class="line" marker-end="url(#arrow)"/><circle cx="741" cy="520" r="15" class="badge"/><text x="741" y="526" text-anchor="middle" class="num">2</text>
  <path d="M1096 520H1138" class="line" marker-end="url(#arrow)"/><circle cx="1117" cy="520" r="15" class="badge"/><text x="1117" y="526" text-anchor="middle" class="num">3</text>

  <!-- Decision row -->
  <rect x="78" y="650" width="430" height="205" rx="20" class="panel blue" filter="url(#shadow)"/>
  <text x="293" y="692" text-anchor="middle" class="t h1">统一控制器与状态</text>
  <text x="293" y="725" text-anchor="middle" class="t code">controller.py</text>
  <text x="293" y="755" text-anchor="middle" class="t body">单任务线程 · 注册/识别流程 · 结果留档</text>
  <text x="293" y="783" text-anchor="middle" class="t small">共享 StateStore → 本地显示与 Web 调试镜像</text>
  <rect x="115" y="808" width="356" height="28" rx="14" fill="#dceff7"/><text x="293" y="828" text-anchor="middle" class="t small">一段语音只采集一次，供声纹与短语识别复用</text>

  <rect x="550" y="650" width="430" height="205" rx="20" class="panel red" filter="url(#shadow)"/>
  <text x="765" y="692" text-anchor="middle" class="t h1">双门控安全决策</text>
  <text x="765" y="725" text-anchor="middle" class="t code">v9_core.py · decide()</text>
  <text x="765" y="755" text-anchor="middle" class="t body">① 身份相似度 ≥ 0.67</text>
  <text x="765" y="783" text-anchor="middle" class="t body">② 命令置信度 ≥ 类别阈值</text>
  <text x="765" y="811" text-anchor="middle" class="t small">unknown / silence 拒绝 · 白名单 · dry‑run / 执行开关</text>
  <rect x="677" y="825" width="176" height="26" rx="13" fill="#f5dede"/><text x="765" y="844" text-anchor="middle" class="t small">任一门失败：禁止动作</text>

  <rect x="1022" y="650" width="386" height="205" rx="20" class="panel green" filter="url(#shadow)"/>
  <text x="1215" y="692" text-anchor="middle" class="t h1">机械臂安全状态机</text>
  <text x="1215" y="725" text-anchor="middle" class="t code">arm_integration.py</text>
  <text x="1215" y="755" text-anchor="middle" class="t body">ArmDispatcher：单飞行任务</text>
  <text x="1215" y="783" text-anchor="middle" class="t small">READY → GRIPPED → PLACED / RESET</text>
  <text x="1215" y="811" text-anchor="middle" class="t small">FAULT 不自动重试 · 显式复位后恢复</text>
  <rect x="1085" y="825" width="260" height="26" rx="13" fill="#dff1e5"/><text x="1215" y="844" text-anchor="middle" class="t small">命令映射：四宫格抓取 / 松开 / 复位</text>

  <path d="M929 606V626H293V650" class="thin" marker-end="url(#arrow)"/>
  <path d="M1273 606V626H765V650" class="thin" marker-end="url(#arrow)"/>
  <path d="M508 752H550" class="line" marker-end="url(#arrow)"/><circle cx="529" cy="752" r="15" class="badge"/><text x="529" y="758" text-anchor="middle" class="num">4</text>
  <path d="M980 752H1022" class="line" marker-end="url(#arrow)"/><circle cx="1001" cy="752" r="15" class="badge"/><text x="1001" y="758" text-anchor="middle" class="num">5</text>

  <!-- execution chain -->
  <rect x="1480" y="364" width="395" height="554" rx="24" class="group" stroke="#62a97c"/>
  <text x="1510" y="400" class="t h2">03 原装执行链</text>
  <rect x="1518" y="448" width="320" height="90" rx="18" class="panel blue"/>
  <text x="1678" y="480" text-anchor="middle" class="t h2">USB‑UART / CH340</text><text x="1678" y="510" text-anchor="middle" class="t small">/dev/ttyUSB0 · 串行命令</text>
  <rect x="1518" y="578" width="320" height="100" rx="18" class="panel teal"/>
  <text x="1678" y="612" text-anchor="middle" class="t h1">Arduino 控制板</text><text x="1678" y="642" text-anchor="middle" class="t small">已验证固件 / 动作序列</text>
  <rect x="1518" y="718" width="320" height="100" rx="18" class="panel purple"/>
  <text x="1678" y="752" text-anchor="middle" class="t h2">舵机总线与机械结构</text><text x="1678" y="782" text-anchor="middle" class="t small">位置闭环 · 六自由度动作执行</text>
  <path d="M1408 752H1458V493H1518" class="line" marker-end="url(#arrow)"/><circle cx="1458" cy="752" r="15" class="badge"/><text x="1458" y="758" text-anchor="middle" class="num">6</text>
  <path d="M1678 538V578" class="line" marker-end="url(#arrow)"/>
  <path d="M1678 678V718" class="line" marker-end="url(#arrow)"/>
  <path d="M1678 818V894H1510" class="feedback" marker-end="url(#arrow2)"/><text x="1595" y="883" class="t small">完成 / 故障状态返回</text>

  <!-- bottom branch -->
  <rect x="45" y="948" width="1830" height="88" rx="20" fill="#fff" stroke="#bfd0da" stroke-width="2"/>
  <text x="76" y="980" class="t h2">注册支路</text>
  <text x="190" y="980" class="t body">三段合格语音 → CAM++嵌入 → 一致性检查 → 均值并L2归一化 → 用户 profile.npy / profile.json</text>
  <text x="76" y="1012" class="t h2">关键原则</text>
  <text x="190" y="1012" class="t body">身份未通过不运行命令识别；命令未通过不下发串口；状态机不允许的动作不执行；Overlay 全程只加载一次。</text>
</svg>
